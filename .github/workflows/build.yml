name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v3.5.2

    - name: Setup
      run: |
        dotnet workload clean
        dotnet workload install android --version 8.0.406
        dotnet workload list
    - name: Nuget Setup
      uses: nuget/setup-nuget@v1.2.0
      with:
        nuget-api-key: ${{secrets.NUGET_API_KEY}}
    - name: Build
      run: dotnet build src/JavaGl.Obj/JavaGl.Obj.csproj /property:Configuration=Release /warnaserror
    - name: Publish
      uses: dansiegel/publish-nuget@v1.2
      with:
        filename: 'src/JavaGl.Obj/bin/Release/JavaGl.Obj.*.nupkg'
        apiKey: ${{ secrets.NUGET_API_KEY }}
